<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealHero</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" href="./images/MealHeroIcon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./images/MealHeroIcon.ico" type="image/x-icon">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="./images/MealHeroLogo.png" alt="Logo">
        <h1 id="logoName">MealHero</h1>
    </div>
    <div class="menu">
        <a href="login.html">Login</a>
        <a href="mappa.html">Explore</a>
        <a href="bookTable.html">Book a Table</a>
        <a href="about.html">About</a>
    </div>
</header>

<main>
    <h1 id="title">
        Discover Restaurants and Food
    </h1>
    <div class="search-container">
        <form id="restaurantSearchForm" action="/restaurant/find" method="GET">
            <input type="text" id="restaurantName" placeholder="Restaurant Name">
            <input type="text" id="location" placeholder="Location">
            <button type="submit">Search</button>
        </form>
    </div>

    <div id="resultsContainer"></div>

    <div class="image-container">
        <img src="./images/img1.png" alt="Image1" id="img1">
        <img src="./images/img2.png" alt="Image2" id="img2">
        <img src="./images/img3.png" alt="Image3" id="img3">
        <img src="./images/img4.png" alt="Image4" id="img4">
    </div>
</main>

<footer>
</footer>

<script src="./js/index.js"></script>
</body>
</html>
